name: Build ZMK firmware
# A push to a branch with an open PR fires both `push` and the PR's
# `synchronize`, which builds the same commit twice. Keep `push` only, so
# branches without a PR still produce firmware artifacts.
on: [push, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
